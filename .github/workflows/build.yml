name: Build Iris

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  TUIST_TOKEN: ${{ secrets.TUIST_TOKEN }}

jobs:
  build:
    name: Build Iris
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7

      - name: Install mise & Tools
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Configure Git for Private Packages
        run: |
          git config --global url."https://x-access-token:${{ secrets.ACTIONS_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Cache SPM binary artifacts
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm/artifacts
          key: spm-artifacts-${{ runner.os }}-${{ hashFiles('Tuist/Package.resolved') }}
          restore-keys: |
            spm-artifacts-${{ runner.os }}-

      - name: Pre-fetch SPM binary artifacts
        run: |
            chmod +x scripts/pre_fetch_spm.sh
            ./scripts/pre_fetch_spm.sh

      - name: Install Project Dependencies
        run: tuist install

      - name: Generate Xcode Workspace
        run: tuist generate

      # No signing certificate is imported on the runner (only the release
      # workflows sign, via scripts/release.sh + Apple API keys). The project
      # forces CODE_SIGN_STYLE=Automatic with a DEVELOPMENT_TEAM, so disable
      # signing here to verify compilation without a cert in the keychain.
      - name: Build App
        run: tuist xcodebuild build -workspace Iris.xcworkspace -scheme Iris -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO

      - name: Run  Tests
        run: tuist xcodebuild test -workspace Iris.xcworkspace -scheme Iris -destination 'platform=macOS' -skip-testing:IrisUITests CODE_SIGNING_ALLOWED=NO

      # On a test-runner launch crash xcodebuild only reports "Early unexpected
      # exit". The real reason (dyld failure, unresolved symbol, startup throw)
      # is in the macOS crash report. Dump it so the next run is diagnosable.
      - name: Dump crash diagnostics
        if: failure()
        run: |
          shopt -s nullglob
          echo "=== ~/Library/Logs/DiagnosticReports ==="
          ls -la ~/Library/Logs/DiagnosticReports/ 2>/dev/null || true
          reports=(~/Library/Logs/DiagnosticReports/Iris-*.ips ~/Library/Logs/DiagnosticReports/Iris*.crash)
          for f in "${reports[@]}"; do
            echo "----- $f -----"
            cat "$f"
          done
