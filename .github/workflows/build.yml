name: Build Impel

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  download:
    name: Build Iris
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          token: ${{ secrets.ACTIONS_PA_TOKEN }}
          
      - name: Install mise & install tuist
        uses: jdx/mise-action@v4
        with:
          cache: true
