name: Build Iris

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  TUIST_TOKEN: ${{ secrets.TUIST_TOKEN }}

jobs:
  build:
    name: Build Iris
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7

      - id: build
        uses: ./.github/actions/build
        with:
          actions_pat: ${{ secrets.ACTIONS_PAT }}

      # On a test-runner launch crash xcodebuild only reports "Early unexpected
      # exit". The real reason (dyld failure, unresolved symbol, startup throw)
      # is in the macOS crash report. Dump it so the next run is diagnosable.
      - name: Dump crash diagnostics
        if: failure()
        run: |
          shopt -s nullglob
          echo "=== ~/Library/Logs/DiagnosticReports ==="
          ls -la ~/Library/Logs/DiagnosticReports/ 2>/dev/null || true
          reports=(~/Library/Logs/DiagnosticReports/Iris-*.ips ~/Library/Logs/DiagnosticReports/Iris*.crash)
          for f in "${reports[@]}"; do
            echo "----- $f -----"
            cat "$f"
          done
