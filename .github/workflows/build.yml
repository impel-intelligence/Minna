name: Build Iris

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  TUIST_TOKEN: ${{ secrets.TUIST_TOKEN }}

jobs:
  build:
    name: Build Iris
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7

      - name: Install mise & Tools
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Configure Git for Private Packages
        run: |
          git config --global url."https://x-access-token:${{ secrets.ACTIONS_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Cache SPM binary artifacts
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm/artifacts
          key: spm-artifacts-${{ runner.os }}-${{ hashFiles('Tuist/Package.resolved') }}
          restore-keys: |
            spm-artifacts-${{ runner.os }}-

      - name: Pre-fetch SPM binary artifacts
        run: |
            chmod +x scripts/pre_fetch_spm.sh
            ./scripts/pre_fetch_spm.sh

      - name: Install Project Dependencies
        run: tuist install

      - name: Generate Xcode Workspace
        run: tuist generate

      # No signing certificate is imported on the runner (only the release
      # workflows sign, via scripts/release.sh + Apple API keys). The project
      # forces CODE_SIGN_STYLE=Automatic with a DEVELOPMENT_TEAM, which fails
      # without a matching cert in the keychain. Override to ad-hoc signing
      # (identity "-", manual style, no team): needs no cert/team but still
      # produces a valid, entitlement-bearing, debuggable app the test runner
      # can launch and inject into.
      - name: Build App
        run: tuist xcodebuild build -workspace Iris.xcworkspace -scheme Iris -destination 'platform=macOS' CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER=

      # The hosted unit tests launch Iris.app as their test host. If the app
      # blocks at launch (e.g. an updater/permission modal) the runner reports
      # "hung before establishing connection" with no crash log. The background
      # sampler below dumps the host process's stack ~45s in — well before the
      # ~6min connection timeout — so a future hang is diagnosable, not opaque.
      - name: Run  Tests
        run: |
          (
            for _ in $(seq 1 40); do
              pid=$(pgrep -x Iris | head -1)
              if [ -n "$pid" ]; then sleep 45; sample "$pid" 5 -mayDie > "$RUNNER_TEMP/iris_hang_sample.txt" 2>&1 || true; break; fi
              sleep 5
            done
          ) &
          tuist xcodebuild test -workspace Iris.xcworkspace -scheme Iris -destination 'platform=macOS' -skip-testing:IrisUITests CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER=

      # On a test-runner launch crash xcodebuild only reports "Early unexpected
      # exit". The real reason (dyld failure, unresolved symbol, startup throw)
      # is in the macOS crash report. Dump it so the next run is diagnosable.
      - name: Dump crash diagnostics
        if: failure()
        run: |
          shopt -s nullglob
          echo "=== ~/Library/Logs/DiagnosticReports ==="
          ls -la ~/Library/Logs/DiagnosticReports/ 2>/dev/null || true
          reports=(~/Library/Logs/DiagnosticReports/Iris-*.ips ~/Library/Logs/DiagnosticReports/Iris*.crash)
          for f in "${reports[@]}"; do
            echo "----- $f -----"
            cat "$f"
          done
          echo "=== Hang sample (if the host app blocked at launch) ==="
          cat "$RUNNER_TEMP/iris_hang_sample.txt" 2>/dev/null || echo "(no hang sample captured)"
