name: Create Internal Iris Build
on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:

env:
  TUIST_TOKEN: ${{ secrets.TUIST_TOKEN }}

jobs:
  validate:
    name: Validate Version Match
    runs-on: macos-26
    if: startsWith(github.ref, 'refs/tags/')

    # Make sure that the version we are dispatching for is properly set
    steps:
      - uses: actions/checkout@v7
      - name: Validate Version Match
        run: grep "${{ github.ref_name }}" Tuist/ProjectDescriptionHelpers/Constants.swift

  prerelease:
    # needs: validate
    name: Build Iris
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7

      # Building
      - name: Install mise & Tools
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Configure Git for Private Packages
        run: |
          git config --global url."https://x-access-token:${{ secrets.ACTIONS_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Cache SPM binary artifacts
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm/artifacts
          key: spm-artifacts-${{ runner.os }}-${{ hashFiles('Tuist/Package.resolved') }}
          restore-keys: |
            spm-artifacts-${{ runner.os }}-

      - name: Pre-fetch SPM binary artifacts
        run: |
            chmod +x scripts/pre_fetch_spm.sh
            ./scripts/pre_fetch_spm.sh

      - name: Install Project Dependencies
        run: tuist install

      - name: Generate Xcode Workspace
        run: tuist generate

      # Notarization & Release
      - name: Make Executable Scripts
        run: |
          chmod +x scripts/release.sh scripts/sentry.sh scripts/create_artifacts.sh  scripts/update_sparkle.sh
      - name: Make tmp
        run: |
          rm -rf tmp
          mkdir tmp
          mkdir tmp/compressed
          mkdir tmp/archive
          mkdir tmp/apps

      - name: Release App
        run: ./scripts/release.sh
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}

      # xcpretty drops the real compiler/signing diagnostics on failure; the
      # script tees the raw xcodebuild output to tmp/logs so it can be read here.
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: tmp/logs/*.log
          if-no-files-found: ignore

      - name: Upload Sentry Information
        run: ./scripts/sentry.sh ${{ secrets.IRIS_SENTRY_AUTH_TOKEN }}

      - name: Create Artifacts
        run: ./scripts/create_artifacts.sh

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            tmp/apps/iris.tar.xz
            tmp/apps/iris.dmg

      # On a test-runner launch crash xcodebuild only reports "Early unexpected
      # exit". The real reason (dyld failure, unresolved symbol, startup throw)
      # is in the macOS crash report. Dump it so the next run is diagnosable.
      - name: Dump crash diagnostics
        if: failure()
        run: |
          shopt -s nullglob
          echo "=== ~/Library/Logs/DiagnosticReports ==="
          ls -la ~/Library/Logs/DiagnosticReports/ 2>/dev/null || true
          reports=(~/Library/Logs/DiagnosticReports/Iris-*.ips ~/Library/Logs/DiagnosticReports/Iris*.crash)
          for f in "${reports[@]}"; do
            echo "----- $f -----"
            cat "$f"
          done
          echo "=== Hang sample (if the host app blocked at launch) ==="
          cat "$RUNNER_TEMP/iris_hang_sample.txt" 2>/dev/null || echo "(no hang sample captured)"
