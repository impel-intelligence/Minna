name: Create Iris Build (Internal)
on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:

jobs:
  build:
    name: Build Iris
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7

      - name: Install mise & Tools
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Configure Git for Private Packages
        run: |
          git config --global url."https://x-access-token:${{ secrets.ACTIONS_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Install Project Dependencies
        run: tuist install

      - name: Generate Xcode Workspace
        run: tuist generate

  notarize:
    needs: build
    name: Notarize Iris
    runs-on: macos-26

    steps:
    - name: Make Executable Scripts
      run: |
        chmod +x scripts/archive.sh scripts/notarize.sh scripts/sentry.sh scripts/update_sparkle.sh scripts/compress.sh scripts/generate_appcast scripts/create_dmg.sh
    - name: Make tmp
      run: |
        rm -rf tmp
        mkdir tmp
        mkdir tmp/compressed
        mkdir tmp/archive
        mkdir tmp/apps
    - name: Export Xcode Archive
      run: ./scripts/archive.sh
    - name: Notarize App
      run: ./scripts/notarize.sh
    - name: Upload Sentry Information
      run: ./scripts/sentry.sh ${{ secrets.SENTRY_AUTH_TOKEN }}

  create_artifacts:
    needs: notarize
    name: Create Artifacts (tar, dmg)
    runs-on: macos-26

    steps:
    - name: Create Tar
      run: ./scripts/compress.sh ${{ github.ref_name }}
    - name: Create DMG
      run: ./scripts/create_dmg.sh ${{ github.ref_name }}

  upload_artifacts:
    if: startsWith(github.ref, 'refs/tags/')
    needs: create_artifacts
    name: Upload Artifacts to GitHub
    runs-on: macos-26

    steps:
    - name: Release
      uses: softprops/action-gh-release@v3
      with:
        prerelease: true
        generate_release_notes: true
        files: |
          tmp/apps/iris.tar.xz
          tmp/apps/iris.dmg
