name: 'Build Iris'
description: 'Build the Iris App using Tuist'
# inputs:
#   who-to-greet:  # id of input
#     description: 'Who to greet'
#     required: true
#     default: 'World'
# outputs:
#   random-number:
#     description: "Random number"
#     value: ${{ steps.random-number-generator.outputs.random-number }}
runs:
  using: "composite"
  steps:
    - name: Install mise & Tools
      uses: jdx/mise-action@v4
      with:
        cache: true

    - name: Configure Git for Private Packages
      run: |
        git config --global url."https://x-access-token:${{ secrets.ACTIONS_PAT }}@github.com/".insteadOf "https://github.com/"
      shell: bash

    - name: Cache SPM binary artifacts
      uses: actions/cache@v4
      with:
        path: ~/Library/Caches/org.swift.swiftpm/artifacts
        key: spm-artifacts-${{ runner.os }}-${{ hashFiles('Tuist/Package.resolved') }}
        restore-keys: |
          spm-artifacts-${{ runner.os }}-

    - name: Pre-fetch SPM binary artifacts
      run: |
          chmod +x scripts/pre_fetch_spm.sh
          ./scripts/pre_fetch_spm.sh
      shell: bash

    - name: Install Project Dependencies
      run: tuist install
      shell: bash

    - name: Generate Xcode Workspace
      run: tuist generate
      shell: bash

    - name: Run Build and Tests
      run: tuist test --skip-ui-tests
      shell: bash

