[tools]
tuist = "4.199.1"
swiftlint = "latest"
swiftformat = { version = "latest", no_app = true, rename_exe = "swiftformat" }

[tasks.format]
description = "Format Swift sources"
run = "swiftformat Iris"

[tasks.format-lint]
description = "Check formatting without modifying files (CI)"
run = "swiftformat Iris --lint"

[tasks.setup-hooks]
description = "Enable the repo's git hooks (pre-commit formatting check)"
run = "git config core.hooksPath .githooks"

[tasks.lint]
description = "Lint Swift sources"
run = "swiftlint lint Iris"

[tasks.lint-fix]
description = "Autocorrect lint violations"
run = "swiftlint --fix Iris"
